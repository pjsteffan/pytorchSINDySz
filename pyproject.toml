[project]
name = "pytorchsindysz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "h5py>=3.16.0",
    "lightning>=2.6.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "optuna>=4.9.0",
    "optuna-dashboard>=0.20.0",
    "optuna-integration[pytorch-lightning]>=4.9.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pybispectra>=1.3.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.6.0",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"